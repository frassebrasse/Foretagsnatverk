# Starter design: two lab subnets connected by a Linux router.
# These addresses are examples and can be changed to match the assignment.
x-lab-node: &lab-node
  build: .
  init: true
  cap_add:
    - NET_ADMIN

services:
  router:
    <<: *lab-node
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      office:
        ipv4_address: 172.30.10.1
      servers:
        ipv4_address: 172.30.20.1

  pc1:
    <<: *lab-node
    command: ["sh", "-c", "ip route add 172.30.20.0/24 via 172.30.10.1 && sleep infinity"]
    networks:
      office:
        ipv4_address: 172.30.10.10

  pc2:
    <<: *lab-node
    command: ["sh", "-c", "ip route add 172.30.20.0/24 via 172.30.10.1 && sleep infinity"]
    networks:
      office:
        ipv4_address: 172.30.10.11

  pc3:
    <<: *lab-node
    command: ["sh", "-c", "ip route add 172.30.10.0/24 via 172.30.20.1 && sleep infinity"]
    networks:
      servers:
        ipv4_address: 172.30.20.10

  server:
    <<: *lab-node
    command: ["sh", "-c", "ip route add 172.30.10.0/24 via 172.30.20.1 && sleep infinity"]
    networks:
      servers:
        ipv4_address: 172.30.20.20

networks:
  office:
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.254
  servers:
    ipam:
      config:
        - subnet: 172.30.20.0/24
          gateway: 172.30.20.254
